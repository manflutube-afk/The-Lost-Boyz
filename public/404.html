    min-height: 100svh;

    margin: 0;
  }

    width: min(60vw, 240px);
    height: auto;

  }

<body>
  <main class="lost">
    <div>
      <img class="lost__logo" src="/images/logo-320.webp" alt="The Lost Boyz" width="320" height="243">

      <p><a class="btn btn--solid" href="/">Back to the start</a></p>
